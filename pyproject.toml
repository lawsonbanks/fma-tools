[project]
name = "fma-tools"
version = "0.3.0"
description = "FMA delivery gates: read-ledger, reconcile, render, doctor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "jsonschema>=4.21",
    "playwright>=1.49",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pymupdf>=1.24",
]

[project.scripts]
fma = "fma_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "xlsxwriter>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fma_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
