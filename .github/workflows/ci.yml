name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync
      - name: Install Playwright chromium
        run: uv run playwright install --with-deps chromium
      - name: Run tests
        run: uv run pytest -q

  # What an agent with only a shared folder does: Python as it finds it, the package
  # with no heavy dependencies, and just enough to pull from Xero and read a ledger.
  light-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install as the mechanism says
        run: |
          python -m pip install openpyxl certifi jsonschema
          python -m pip install --no-deps .
      - name: The command answers by contract with nothing configured
        run: |
          set +e
          FMA_CONFIG_DIR="$RUNNER_TEMP/none" python -m fma_tools.cli xero accounts > out.json
          test $? -eq 3
          python -c "import json; e = json.load(open('out.json')); assert e['problems'][0]['code'] == 'XERO_NOT_CONFIGURED', e"
      - name: Xero and read-ledger tests on that install
        run: |
          python -m pip install pytest xlsxwriter
          python -m pytest -q tests/test_xero_auth.py tests/test_xero_client.py tests/test_xero_pull.py tests/test_xero_group.py tests/test_xero_reports.py tests/test_read_ledger.py
